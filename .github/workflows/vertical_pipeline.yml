name: Vertical Pipeline

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      vertical_index:
        description: 'Vertical index (0-21), leave blank for day-of-year rotation'
        required: false
        default: ''
      industry_query:
        description: 'On-demand: free-text industry/theme. Overrides vertical_index; writes to the "On-Demand Pipeline" tab.'
        required: false
        default: ''
  repository_dispatch:
    types: [run-industry-pipeline]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests gspread google-auth feedparser
      - name: Run vertical pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          VERTICAL_INDEX: ${{ github.event.inputs.vertical_index }}
          # On-demand industry query: from a manual run's input, or a repository_dispatch
          # (type: run-industry-pipeline) client_payload.industry_query.
          INDUSTRY_QUERY: ${{ github.event.inputs.industry_query || github.event.client_payload.industry_query }}
          # Optional: set repo variable PIPELINE_MODEL to pin/trial a model. Blank -> code default.
          PIPELINE_MODEL: ${{ vars.PIPELINE_MODEL }}
          # Optional: set repo variable EXTRA_SOURCES to "0" to skip YC Launches / Product Hunt / VC newsletters.
          EXTRA_SOURCES: ${{ vars.EXTRA_SOURCES }}
          # Optional: V21_SCRAPE="0" skips the V21 scrape layer; V21_SCRAPE_MAX_NEW caps new companies per run.
          V21_SCRAPE: ${{ vars.V21_SCRAPE }}
          V21_SCRAPE_MAX_NEW: ${{ vars.V21_SCRAPE_MAX_NEW }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python vertical_pipeline.py
